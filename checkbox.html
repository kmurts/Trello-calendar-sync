<!DOCTYPE html>
<html>
  <head>
    <script src="https://p.trellocdn.com/power-up.min.js"></script>
    <style>
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 5px; margin: 0; background-color: transparent; }
      label { cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; color: white; }
      input[type="checkbox"] { cursor: pointer; width: 16px; height: 16px; margin: 0; }
    </style>
  </head>
  <body>
    
    <label>
      <input type="checkbox" id="gcal-trigger">
      Open as new Google Calendar Event
    </label>

    <script>
      const t = window.TrelloPowerUp.iframe();

      function formatForCalendar(text) {
        if (!text) return '';

        // 1. Split the text into chunks using the horizontal dividers (---)
        let chunks = text.split(/\s*---\s*/);
        let keepChunks = [];

        for (let i = 0; i < chunks.length; i++) {
          let chunk = chunks[i];
          
          // 2. If the chunk contains Filepath or Quote, skip it entirely
          if (/Filepath/i.test(chunk) || /Quote/i.test(chunk)) {
            continue;
          }

          // 3. Delete any line that starts with a "#" to completely remove the header titles
          chunk = chunk.replace(/^#+.*$/gm, '');

          // 4. Clean up any invisible characters (like the ones in your blank Email field) and trim spaces
          chunk = chunk.replace(/\u200C/g, '').trim();

          // 5. If there is actual text left, keep it
          if (chunk) {
            keepChunks.push(chunk);
          }
        }
        
        // 6. Join the kept data together with line breaks
        return keepChunks.join('\n\n');
      }

      document.getElementById('gcal-trigger').addEventListener('change', function(e) {
        if (e.target.checked) {
          t.card('name', 'desc').then(function(card) {
            const title = encodeURIComponent(card.name || '');
            const desc = encodeURIComponent(formatForCalendar(card.desc));
            const url = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&details=${desc}`;
            
            window.open(url, '_blank');
            setTimeout(() => { e.target.checked = false; }, 1000);
          });
        }
      });
    </script>
  </body>
</html>
