<!DOCTYPE html>
<html>
  <head>
    <script src="https://p.trellocdn.com/power-up.min.js"></script>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        padding: 5px;
        margin: 0;
        background-color: transparent; 
      }
      label {
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        font-weight: 500;
        color: white; 
      }
      input[type="checkbox"] {
        cursor: pointer;
        width: 16px;
        height: 16px;
        margin: 0;
      }
    </style>
  </head>
  <body>
    
    <label>
      <input type="checkbox" id="gcal-trigger">
      Open as new Google Calendar Event
    </label>

    <script>
      const t = window.TrelloPowerUp.iframe();

      // UPDATED FUNCTION: Advanced formatting and filtering
      function formatForCalendar(text) {
        if (!text) return '';
        
        // 1. Strip out all asterisks and underscores to clean up formatting first
        text = text.replace(/[\*_]{1,3}/g, '');

        // 2. Remove the Filepath and Quote sections (and their contents) entirely
        text = text.replace(/^#{1,6}\s+(Filepath|Quote)[\s\S]*?(?=(^#{1,6}\s+|$))/gim, '');

        // 3. Remove all horizontal lines (---)
        text = text.replace(/^---\s*$/gm, '');

        // 4. Wrap the specific titles we want to keep in HTML bold tags
        text = text.replace(/^#{1,6}\s+(Name & Contact|Phone|Email|Address|Request)/gim, '<b>$1</b>');

        // 5. Remove any leftover heading symbols (like #) just in case
        text = text.replace(/^#{1,6}\s+/gm, '');

        // 6. Fix spacing to avoid huge gaps left behind by deleted text
        text = text.replace(/\n{3,}/g, '\n\n').trim();

        // 7. Convert line breaks to HTML so Google Calendar renders them correctly alongside the bold tags
        text = text.replace(/\n/g, '<br>');

        return text;
      }

      document.getElementById('gcal-trigger').addEventListener('change', function(e) {
        if (e.target.checked) {
          t.card('name', 'desc').then(function(card) {
            const title = encodeURIComponent(card.name || '');
            
            // Run the description through our new formatting function
            const desc = encodeURIComponent(formatForCalendar(card.desc));
            
            const url = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&details=${desc}`;
            
            window.open(url, '_blank');
            
            setTimeout(() => { e.target.checked = false; }, 1000);
          });
        }
      });
    </script>
  </body>
</html>
