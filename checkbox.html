<!DOCTYPE html>
<html>
  <head>
    <script src="https://p.trellocdn.com/power-up.min.js"></script>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        padding: 5px;
        margin: 0;
        background-color: transparent; 
      }
      label {
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        font-weight: 500;
        color: white; 
      }
      input[type="checkbox"] {
        cursor: pointer;
        width: 16px;
        height: 16px;
        margin: 0;
      }
    </style>
  </head>
  <body>
    
    <label>
      <input type="checkbox" id="gcal-trigger">
      Open as new Google Calendar Event
    </label>

    <script>
      const t = window.TrelloPowerUp.iframe();

      // NEW FUNCTION: This strips out the Markdown symbols from Trello
      function cleanMarkdown(text) {
        if (!text) return '';
        return text
          .replace(/^#{1,6}\s+/gm, '')       // Removes headers (e.g., ###, #)
          .replace(/^---\s*$/gm, '')         // Removes horizontal lines (---)
          .replace(/[\*_]{1,3}/g, '')        // Removes bold and italic markers (*, _, **, __)
          .replace(/\n{3,}/g, '\n\n')        // Cleans up extra empty lines left behind
          .trim();
      }

      document.getElementById('gcal-trigger').addEventListener('change', function(e) {
        if (e.target.checked) {
          t.card('name', 'desc').then(function(card) {
            const title = encodeURIComponent(card.name || '');
            
            // Run the description through our cleanup function before encoding it
            const cleanDesc = cleanMarkdown(card.desc);
            const desc = encodeURIComponent(cleanDesc);
            
            const url = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&details=${desc}`;
            
            window.open(url, '_blank');
            
            setTimeout(() => { e.target.checked = false; }, 1000);
          });
        }
      });
    </script>
  </body>
</html>
