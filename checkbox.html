<!DOCTYPE html>
<html>
  <head>
    <script src="https://p.trellocdn.com/power-up.min.js"></script>
    <style>
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 5px; margin: 0; background-color: transparent; }
      label { cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; color: white; }
      input[type="checkbox"] { cursor: pointer; width: 16px; height: 16px; margin: 0; }
    </style>
  </head>
  <body>
    
    <label>
      <input type="checkbox" id="gcal-trigger">
      Open as new Google Calendar Event
    </label>

    <script>
      const t = window.TrelloPowerUp.iframe();

      function formatForCalendar(text) {
        if (!text) return '';

        text = text.replace(/Filepath[\s\S]*/gi, '');
        text = text.replace(/Quote[\s\S]*/gi, '');

        text = text.replace(/^#{1,6}\s+/gm, ''); 
        text = text.replace(/^---\s*$/gm, '');   
        text = text.replace(/[\*_]{1,3}/g, '');  
        
        text = text.replace(/^Name & Contact.*/gim, '');
        text = text.replace(/^Phone.*/gim, '');
        text = text.replace(/^Email.*/gim, '');
        text = text.replace(/^Address.*/gim, '');
        text = text.replace(/^Request.*/gim, '');

        text = text.replace(/\u200C/g, '');
        text = text.replace(/\n{2,}/g, '\n\n');
        
        return text.trim();
      }

      document.getElementById('gcal-trigger').addEventListener('change', function(e) {
        if (e.target.checked) {
          t.card('name', 'desc').then(function(card) {
            const title = encodeURIComponent(card.name || '');
            const desc = encodeURIComponent(formatForCalendar(card.desc));
            const url = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&details=${desc}`;
            
            // SAFARI FIX: Create an invisible link, click it, and remove it
            const link = document.createElement('a');
            link.href = url;
            link.target = '_blank';
            link.rel = 'noopener noreferrer'; // This severs the connection to the Trello iframe
            
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            setTimeout(() => { e.target.checked = false; }, 1000);
          });
        }
      });
    </script>
  </body>
</html>
