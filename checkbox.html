<!DOCTYPE html>
<html>
  <head>
    <script src="https://p.trellocdn.com/power-up.min.js"></script>
    <style>
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 5px; margin: 0; background-color: transparent; }
      a.custom-link { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; color: white; text-decoration: none; cursor: pointer; }
      input[type="checkbox"] { cursor: pointer; width: 16px; height: 16px; margin: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    
    <a id="gcal-link" class="custom-link" target="_blank" rel="noopener noreferrer">
      <input type="checkbox" id="gcal-trigger">
      Open as new Google Calendar Event
    </a>

    <script>
      const t = window.TrelloPowerUp.iframe();
      const checkbox = document.getElementById('gcal-trigger');
      const link = document.getElementById('gcal-link');

      function formatForCalendar(text) {
        if (!text) return '';

        text = text.replace(/Filepath[\s\S]*/gi, '');
        text = text.replace(/Quote[\s\S]*/gi, '');

        text = text.replace(/^#{1,6}\s+/gm, ''); 
        text = text.replace(/^---\s*$/gm, '');   
        text = text.replace(/[\*_]{1,3}/g, '');  
        
        text = text.replace(/^Name & Contact.*/gim, '');
        text = text.replace(/^Phone.*/gim, '');
        text = text.replace(/^Email.*/gim, '');
        text = text.replace(/^Address.*/gim, '');
        text = text.replace(/^Request.*/gim, '');

        text = text.replace(/\u200C/g, '');
        text = text.replace(/\n{2,}/g, '\n\n');
        
        return text.trim();
      }

      t.render(function() {
        t.card('name', 'desc').then(function(card) {
          const title = encodeURIComponent(card.name || '');
          const desc = encodeURIComponent(formatForCalendar(card.desc));
          
          const gcalUrl = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&details=${desc}`;
          
          link.href = `./redirect.html?to=${encodeURIComponent(gcalUrl)}`;
        });
      });

      link.addEventListener('click', function() {
        checkbox.checked = true;
        setTimeout(() => { checkbox.checked = false; }, 1000);
      });
    </script>
  </body>
</html>
